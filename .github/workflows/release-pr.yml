name: Create Release PR (develop → main)

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  create-release-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Release PR を作成または更新
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          TITLE="Release: $(TZ='Asia/Tokyo' date +%Y/%m/%d)"

          EXISTING_PR=$(gh pr list \
            --base main \
            --head develop \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "$EXISTING_PR" ]; then
            gh pr edit "$EXISTING_PR" --title "$TITLE"
            echo "Release PR #${EXISTING_PR} を更新しました"
          else
            gh pr create \
              --base main \
              --head develop \
              --title "$TITLE" \
              --body "## 含まれる変更

$(git log origin/main..origin/develop --first-parent --pretty='- %s')"
            echo "Release PR を作成しました"
          fi
